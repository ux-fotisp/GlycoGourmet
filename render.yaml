# ==============================================================================
# GlycoGourmet — Render Blueprint Specification (Synthetic Demo Backend)
# Target Environment: Public Demonstration Only (Synthetic Data)
# Documentation: infra/RENDER-DEMO-DEPLOYMENT.md
# ==============================================================================

services:
  - type: web
    name: glycogourmet-demo-api
    env: docker
    plan: free
    region: frankfurt
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /_health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 1337
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: glycogourmet-demo-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: CORS_ORIGIN
        value: https://glycogourmet.netlify.app
      # Strapi secrets managed in Render Dashboard (sync: false; never committed to git)
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      # SG-1 / SG-3 Credential Guard: controlled demo account password
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: glycogourmet-demo-postgres
    databaseName: glycogourmet
    user: glycogourmet_user
    plan: free # Note: Render Free Tier PostgreSQL is disposable/temporary (expires after 30 days, no automated backups)
    region: frankfurt
    postgresMajorVersion: 16
