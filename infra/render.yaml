# ==============================================================================
# GlycoGourmet — Render Blueprint Specification
# Candidate Backend Infrastructure: Strapi v4 Headless CMS + Managed PostgreSQL
# Documentation: infra/README.md
# ==============================================================================

services:
  - type: web
    name: glycogourmet-api
    env: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 1337
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: glycogourmet-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      # SG-1 / SG-3 Credential Hardening: required for non-default seed passwords
      - key: SEED_PASSWORD
        generateValue: true
      # CORS Whitelist matching server/config/middlewares.js
      - key: CORS_ORIGIN
        value: https://glycogourmet.netlify.app

databases:
  - name: glycogourmet-postgres
    databaseName: glycogourmet
    user: glycogourmet_user
    plan: starter
    region: frankfurt
    postgresMajorVersion: 16
