name: GlycoGourmet Production CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CI: 'true'

jobs:
  # =========================================================================
  # STAGE 1: Static Analysis, Strict Typecheck & Secret Audit
  # =========================================================================
  static-analysis:
    name: 1. Static Analysis & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security & Secret Audit
        run: |
          npm audit --audit-level=high
          if grep -rn "sk_live\|AIzaSy" src/ --exclude-dir=node_modules; then
            echo "::error::Potential hardcoded API Secret Key detected!"
            exit 1
          fi

      - name: Run ESLint (Flat Config) / Oxlint
        run: npx oxlint src/

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

  # =========================================================================
  # STAGE 2: Deterministic Unit Gate (100% Coverage Enforcement)
  # =========================================================================
  deterministic-unit-gate:
    name: 2. Deterministic Unit Gate
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest with Strict 100% Coverage Thresholds
        run: |
          npx vitest run --coverage \
            --coverage.lines=100 \
            --coverage.functions=100 \
            --coverage.branches=100 \
            --coverage.statements=100 \
            tests/unit/metabolicEngine.spec.ts

  # =========================================================================
  # STAGE 3: Accessibility & Chromatic Contrast Audits
  # =========================================================================
  a11y-audit:
    name: 3. WCAG 2.1 AA & Contrast Audits
    needs: deterministic-unit-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Execute Axe-Core Automated Accessibility Suite
        run: npx playwright test tests/a11y/contrastAudit.spec.ts --project="Desktop Chrome"

  # =========================================================================
  # STAGE 4: Multi-Browser End-to-End Integration Matrix
  # =========================================================================
  e2e-matrix:
    name: 4. E2E Matrix (${{ matrix.browser }})
    needs: a11y-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright System Dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Execute Playwright E2E Scenarios
        run: npx playwright test tests/e2e/metabolicJourneys.spec.ts --project="${{ matrix.browser }}"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  # =========================================================================
  # STAGE 5: Production Build & Netlify SPA Routing Verification
  # =========================================================================
  build-and-verify:
    name: 5. Build & SPA Integrity Gate
    needs: [e2e-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle (Vite)
        run: npm run build

      - name: Verify Netlify SPA Redirect Rules (_redirects)
        run: |
          echo "Verifying SPA deployment integrity..."
          if [ ! -f "dist/_redirects" ]; then
            echo "::error::Missing dist/_redirects! Client-side routing in React Router v7 will break on direct navigation."
            exit 1
          fi
          
          if ! grep -q "/\*    /index.html   200" dist/_redirects; then
            echo "::error::Invalid _redirects rule format! Expected '/*    /index.html   200'"
            exit 1
          fi
          
          echo "SPA redirect rules verified successfully."
