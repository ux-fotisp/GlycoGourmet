name: DAVE+R Governance Gate Enforcement

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'governance/**'
      - 'backend_dev.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  governance-gates:
    name: Governance Gate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Execute Mechanical Governance Gates
        id: run_gates
        run: node scripts/governance-gates.js

      - name: Post PR Comment on Gate Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'governance-gate-report.json');
            
            let commentBody = '### ❌ DAVE+R Governance Gate Verification Failed\n\n';
            commentBody += 'The following mechanical governance gate(s) failed on this Pull Request:\n\n';
            
            if (fs.existsSync(reportPath)) {
              try {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                if (report.failures && report.failures.length > 0) {
                  for (const f of report.failures) {
                    commentBody += `#### ✖ \`${f.gateId}\`: ${f.description}\n`;
                    commentBody += `> **Error / Finding:**\n> \`\`\`\n> ${f.error}\n> \`\`\`\n\n`;
                  }
                } else {
                  commentBody += 'The gate script exited non-zero with an unexpected runtime error. Check the workflow logs.\n';
                }
                
                if (report.warnings && report.warnings.length > 0) {
                  commentBody += '#### ⚠️ Warnings (Non-Blocking):\n';
                  for (const w of report.warnings) {
                    commentBody += `- **\`${w.gateId}\`**: ${w.description}\n  > ${w.warning}\n`;
                  }
                  commentBody += '\n';
                }
              } catch (e) {
                commentBody += `Failed to parse gate report JSON: ${e.message}. Please inspect the step logs.\n`;
              }
            } else {
              commentBody += 'No `governance-gate-report.json` was generated. Please review the Actions log for details.\n';
            }
            
            commentBody += '\n---\n*Automated gate enforcement by `scripts/governance-gates.js` per [`governance/GOVERNANCE.md`](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/feat/dave-r-governance-workers/governance/GOVERNANCE.md).*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
